<svg width="860" height="330" viewBox="0 0 860 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="tushar@vancouver terminal intro">
  <style>
    text { font-family: 'SFMono-Regular', 'Cascadia Code', 'Fira Code', Consolas, Menlo, monospace; font-size: 15px; }
    .p { fill: #3fb950; }
    .c { fill: #e6edf3; }
    .o { fill: #8b949e; }
    .b { fill: #58a6ff; }
    .y { fill: #d29922; }
    .line { opacity: 0; animation: reveal .01s linear forwards; }
    @keyframes reveal { to { opacity: 1; } }
    .d1 { animation-delay: .2s; }
    .d2 { animation-delay: .55s; }
    .d3 { animation-delay: 1.0s; }
    .d4 { animation-delay: 1.35s; }
    .d5 { animation-delay: 1.8s; }
    .d6 { animation-delay: 2.15s; }
    .d7 { animation-delay: 2.35s; }
    .d8 { animation-delay: 2.8s; }
    .cursor { fill: #e6edf3; opacity: 0; animation: reveal .01s linear 2.9s forwards, blink 1.2s steps(1) 2.9s infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="860" height="330" rx="12" fill="#0d1117"/>
  <path d="M0 36 h860 v-24 a12 12 0 0 0 -12 -12 h-836 a12 12 0 0 0 -12 12 z" fill="#161b22"/>
  <rect x="0.5" y="0.5" width="859" height="329" rx="12" fill="none" stroke="#30363d"/>

  <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="18" r="6" fill="#27c93f"/>
  <text x="430" y="23" text-anchor="middle" class="o" font-size="12">tushar@vancouver — zsh</text>

  <text class="line d1" x="28" y="76"><tspan class="p">$</tspan> <tspan class="c">whoami</tspan></text>
  <text class="line d2" x="28" y="102"><tspan class="b">tushar shandilya</tspan><tspan class="o"> — data · analytics · ai · software</tspan></text>

  <text class="line d3" x="28" y="140"><tspan class="p">$</tspan> <tspan class="c">cat ./currently</tspan></text>
  <text class="line d4" x="28" y="166"><tspan class="o">data &amp; ai analyst @ </tspan><tspan class="c">moldavite</tspan><tspan class="o">  ·  co-founder @ </tspan><tspan class="c">cerebramha technologies</tspan></text>

  <text class="line d5" x="28" y="204"><tspan class="p">$</tspan> <tspan class="c">grep "philosophy" ~/.profile</tspan></text>
  <text class="line d6" x="28" y="230"><tspan class="y">"the worst failure is the quiet one —</tspan></text>
  <text class="line d7" x="28" y="256"><tspan class="y"> nothing errors out, the output is just wrong."</tspan></text>

  <text class="line d8" x="28" y="296"><tspan class="p">$</tspan></text>
  <rect class="cursor" x="46" y="282" width="9" height="18"/>
</svg>
